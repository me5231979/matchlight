<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Proposal · Matchlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* A printed proposal: Letter pages on a warm desk on screen, clean pages in print. Ink, paper, one ember accent. */
:root {
  color-scheme: light;
  --paper: #FFFFFF;
  --desk: #EDEAE4;
  --ink: #0E0E0C;
  --body: #3A3833;
  --mute: #7A766E;
  --rule: #E4DFD7;
  --ember: #E8501A;
  --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --serif: 'Instrument Serif', Georgia, serif;
  --mono: 'Geist Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--desk); }
body { margin: 0; background: var(--desk); color: var(--body); font: 400 10.5pt/1.6 var(--sans); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.toolbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--desk) 88%, transparent); backdrop-filter: blur(8px); }
.toolbar .brand { font: 600 15px var(--sans); color: var(--ink); letter-spacing: -.03em; }
.toolbar .brand span { color: var(--ember); margin-right: 5px; }
.toolbar button { font: 500 14px var(--sans); border-radius: 999px; padding: 9px 18px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
.toolbar button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.pages { display: grid; justify-content: center; gap: 28px; padding: 12px 16px 64px; }
.page { width: 8.5in; max-width: 100%; min-height: 11in; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.08); padding: .85in .85in .7in; position: relative; display: flex; flex-direction: column; }
.mono { font: 500 7.5pt var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.wordmark { font: 600 15pt var(--sans); letter-spacing: -.035em; color: var(--ink); }
.wordmark span { color: var(--ember); margin-right: 4px; }

/* Cover */
.cover { justify-content: space-between; }
.cover .top { display: flex; justify-content: space-between; align-items: baseline; }
.cover h1 { font: 400 46pt/1 var(--serif); letter-spacing: -.01em; color: var(--ink); margin: 0; text-wrap: balance; }
.cover h1 em { color: var(--ember); }
.cover .for { margin-top: 18pt; font-size: 13pt; color: var(--body); }
.cover .meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18pt; border-top: 1px solid var(--ink); padding-top: 12pt; }
.cover .meta b { display: block; color: var(--ink); font-weight: 500; margin-top: 3pt; font-size: 10.5pt; }
.strike { height: 3px; width: 96px; background: linear-gradient(90deg, var(--ember), #FFB547); margin: 22pt 0 0; }

/* Inner pages */
h2 { font: 400 22pt/1.1 var(--serif); color: var(--ink); margin: 0 0 10pt; letter-spacing: -.005em; }
h2 em { color: var(--ember); }
h3 { font: 600 10.5pt var(--sans); color: var(--ink); margin: 0 0 4pt; }
.section { margin-top: 26pt; }
.section:first-of-type { margin-top: 0; }
.lead { font-size: 12pt; line-height: 1.55; color: var(--body); max-width: 60ch; }
.invest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14pt; margin-top: 12pt; }
.figure { border: 1px solid var(--rule); border-radius: 10pt; padding: 14pt 16pt; }
.figure .v { font: 500 26pt/1.1 var(--sans); letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 4pt; }
.figure .v small { font-size: 11pt; color: var(--mute); font-weight: 400; letter-spacing: 0; }
.figure p { margin: 4pt 0 0; color: var(--mute); font-size: 9.5pt; }
.scope { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10pt 22pt; margin-top: 10pt; }
.scope div { border-top: 1px solid var(--rule); padding-top: 8pt; break-inside: avoid; }
.scope p { margin: 0; color: var(--mute); font-size: 9.5pt; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8pt; }
td { padding: 7pt 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.n { text-align: right; white-space: nowrap; color: var(--ink); }
td small { display: block; color: var(--mute); font-size: 9pt; }
tr.total td { border-bottom: 0; border-top: 1px solid var(--ink); font-weight: 600; color: var(--ink); }
.steps { counter-reset: s; display: grid; gap: 8pt; margin-top: 10pt; }
.steps div { display: grid; grid-template-columns: 22pt minmax(0, 1fr) auto; gap: 8pt; align-items: baseline; border-top: 1px solid var(--rule); padding-top: 7pt; }
.steps div::before { counter-increment: s; content: counter(s, decimal-leading-zero); font: 500 8pt var(--mono); color: var(--ember); }
.steps span.w { font: 500 8pt var(--mono); color: var(--mute); }
ul.clean { margin: 6pt 0 0; padding-left: 14pt; }
ul.clean li { margin: 3pt 0; }
.sign { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28pt; margin-top: 30pt; }
.sign div { border-top: 1px solid var(--ink); padding-top: 6pt; font-size: 9pt; color: var(--mute); }
.foot { margin-top: auto; padding-top: 22pt; display: flex; justify-content: space-between; color: var(--mute); font-size: 8pt; }
.empty { display: grid; place-items: center; min-height: 60vh; color: var(--mute); text-align: center; padding: 24px; }

@media screen and (max-width: 900px) {
  .page { padding: 28px 22px; min-height: 0; }
  .cover h1 { font-size: 34pt; }
  .invest, .scope, .sign, .cover .meta { grid-template-columns: minmax(0, 1fr); }
}
@page { size: Letter; margin: 0; }
@media print {
  html, body { background: #fff; }
  .toolbar { display: none; }
  .pages { padding: 0; gap: 0; display: block; }
  .page { box-shadow: none; width: 8.5in; height: 11in; min-height: 11in; overflow: hidden; break-after: page; }
  .page:last-child { break-after: auto; }
}
</style>
</head>
<body>
<div class="toolbar">
  <div class="brand"><span>/</span>matchlight</div>
  <button type="button" id="print">Print or save as PDF</button>
</div>
<div class="pages" id="pages"><div class="empty"><p>Open this proposal from the quote builder, or use the link you were sent.</p></div></div>

<script>
(function () {
  var usd = function (n) { return '$' + Math.round(n || 0).toLocaleString('en-US'); };
  var esc = function (x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var today = new Date();
  var fmt = function (d) { return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); };
  var valid = new Date(today.getTime() + 30 * 864e5);

  function number(q) {
    var h = 0, s = (q.client || '') + (q.project || '') + (q.build || 0);
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    var yy = String(today.getFullYear()).slice(2), mm = String(today.getMonth() + 1).padStart(2, '0');
    return 'ML-' + yy + mm + '-' + String(h % 10000).padStart(4, '0');
  }

  function render(q) {
    if (!q || !q.build) return;
    document.title = 'Proposal: ' + (q.project || 'Simulation') + (q.client ? ' · ' + q.client : '') + ' · Matchlight';
    var no = number(q);
    var title = esc(q.project || 'Your simulation');
    var words = title.split(' ');
    var titleHtml = words.length > 1 ? words.slice(0, -1).join(' ') + ' <em>' + words[words.length - 1] + '</em>' : '<em>' + title + '</em>';
    var foot = function (p) { return '<div class="foot"><span>Matchlight · hello@matchlight.ai</span><span>' + no + ' · ' + p + '</span></div>'; };
    var ongoing = q.ongoing > 0;
    var w = q.weeks || 6;
    var phases = [
      ['Discovery and design', 'Goals, behaviors, rubric, scenario outline', Math.max(1, Math.round(w * 0.2))],
      ['Build', 'World, characters, conversations, coaching', Math.max(2, Math.round(w * 0.5))],
      ['Pilot and refine', 'Test with a small group, tune scoring and dialogue', Math.max(1, Math.round(w * 0.2))],
      ['Launch' + (q.handover ? ' and handover' : ''), q.handover ? 'Go live on your accounts, hand over source and setup guide' : 'Go live, monitoring and support begin', 1],
    ];
    var invest =
      '<div class="invest">' +
        '<div class="figure"><div class="mono">One-time build</div><div class="v">' + usd(q.build) + '</div><p>' + (q.scenarios ? q.scenarios + ' scenario' + (q.scenarios === 1 ? '' : 's') + ', ' : '') + 'delivered in about ' + w + ' weeks</p></div>' +
        '<div class="figure"><div class="mono">' + (q.handover ? 'Support from Matchlight' : 'Ongoing') + '</div><div class="v">' + (ongoing ? usd(q.ongoing) + ' <small>per year</small>' : 'None') + '</div><p>' +
          (ongoing ? (q.monthly ? usd(q.month) + ' per month' : 'Billed annually') + (q.learners ? ', for up to ' + q.learners + ' learners' : '') : q.handover ? 'You own it and run it on your own accounts' : 'Runs in your LMS with no ongoing fee') + '</p></div>' +
      '</div>';
    var label = function (n) { return n === 'Vendor platform share' ? 'AI platform access' : n; };
    var lines = (q.lines || []).map(function (l) { return '<tr><td>' + esc(label(l[0])) + '<small>' + esc(l[1]) + '</small></td><td class="n">' + usd(l[2]) + '</td></tr>'; }).join('');
    var direct = (q.direct || []).map(function (d) { return '<tr><td>' + esc(d[0]) + '</td><td class="n">' + usd(d[1]) + ' / mo</td></tr>'; }).join('');

    var cover =
      '<section class="page cover">' +
        '<div class="top"><div class="wordmark"><span>/</span>matchlight</div><div class="mono">Proposal</div></div>' +
        '<div><div class="mono">' + (q.client ? 'Prepared for ' + esc(q.client) : 'Proposal') + '</div>' +
          '<h1 style="margin-top:14pt">' + titleHtml + '</h1>' +
          '<div class="strike"></div>' +
          '<p class="for">' + esc(q.delivery || '') + '</p></div>' +
        '<div class="meta">' +
          '<div><span class="mono">Prepared for</span><b>' + esc(q.contact || q.client || '') + '</b>' + (q.contact && q.client ? '<span style="font-size:9pt;color:var(--mute)">' + esc(q.client) + '</span>' : '') + '</div>' +
          '<div><span class="mono">Prepared by</span><b>' + esc(q.preparedBy || 'Matchlight') + '</b><span style="font-size:9pt;color:var(--mute)">Matchlight</span></div>' +
          '<div><span class="mono">Date · Reference</span><b>' + fmt(today) + '</b><span style="font-size:9pt;color:var(--mute)">' + no + '</span></div>' +
        '</div>' +
      '</section>';

    var p2 =
      '<section class="page">' +
        '<div class="section"><div class="mono">01 · Summary</div><h2 style="margin-top:6pt">Practice the moments that <em>matter</em>, before they happen.</h2>' +
          '<p class="lead">' + (q.client ? esc(q.client) + (/s$/i.test(q.client) ? '’' : '’s') : 'Your') + ' people will step into a realistic workplace, read the signals, hold the conversation, and see what happens two weeks later. Every choice is coached, so the skill transfers to the real conversation.</p></div>' +
        '<div class="section"><div class="mono">02 · What we build</div><div class="scope">' +
          (q.notes || []).map(function (n) { return '<div><h3>' + esc(n[0]) + '</h3><p>' + esc(n[1]) + '</p></div>'; }).join('') + '</div></div>' +
        foot('2') +
      '</section>' +
      '<section class="page">' +
        '<div class="section"><div class="mono">03 · Investment</div><h2 style="margin-top:6pt">One build fee, ' + (ongoing ? 'one <em>yearly</em> fee.' : '<em>nothing</em> ongoing.') + '</h2>' + invest +
          (lines ? '<table>' + lines + '<tr class="total"><td>' + (q.handover ? 'Support' : 'Ongoing') + ' per year</td><td class="n">' + usd(q.ongoing) + '</td></tr></table>' : '') + '</div>' +
        foot('3') +
      '</section>';

    var p3 =
      '<section class="page">' +
        '<div class="section"><div class="mono">04 · Timeline</div><h2 style="margin-top:6pt">About <em>' + w + ' weeks</em> from kickoff to launch.</h2><div class="steps">' +
          phases.map(function (p) { return '<div><span><h3>' + p[0] + '</h3><span style="color:var(--mute);font-size:9.5pt">' + p[1] + '</span></span><span class="w">' + p[2] + ' wk' + (p[2] === 1 ? '' : 's') + '</span></div>'; }).join('') + '</div></div>' +
        (q.handover
          ? '<div class="section"><div class="mono">05 · Accounts and ownership</div><p style="margin:6pt 0 0">Before the build starts, you provide API keys for the AI services and hosting. All usage, including testing during the build, bills to your accounts. At the end of the build you receive:</p>' +
            '<ul class="clean"><li>Git repositories with full source code</li><li>Design files, character and media assets</li><li>' + (q.dkind === 'hosted' ? 'Deployment setup for your hosting' : 'The SCORM package and the source to rebuild it') + '</li><li>A setup guide for your accounts and API keys, and how to rotate them</li><li>A handover and training session with your team</li></ul>' +
            (direct ? '<h3 style="margin-top:12pt">Your direct vendor costs (estimate)</h3><table>' + direct + '<tr class="total"><td>About</td><td class="n">' + usd(q.directMonth) + ' / mo</td></tr></table>' : '') + '</div>'
          : (q.ai ? '<div class="section"><div class="mono">05 · Usage included</div><p style="margin:6pt 0 0">The ongoing fee covers hosting and AI services for up to ' + (q.learners || 'the agreed number of') + ' learners, ' + (q.rounds || 0) + ' practice round' + (q.rounds === 1 ? '' : 's') + ' each per month of about ' + (q.minutes || 0) + ' minutes' + (q.months && q.months < 12 ? ', ' + q.months + ' months a year' : '') + '. Additional practice is billed per round at cost plus handling.</p></div>' : '')) +
        '<div class="section"><div class="mono">' + (q.handover || q.ai ? '06' : '05') + ' · Terms</div><ul class="clean">' +
          '<li>Build: 50% at kickoff, 50% at launch.</li>' +
          (ongoing ? '<li>' + (q.handover ? 'Support' : 'Ongoing services') + ': ' + (q.monthly ? 'billed monthly' : 'billed annually in advance') + ', starting at launch.</li>' : '') +
          '<li>This proposal is valid until ' + fmt(valid) + '.</li>' +
          '<li>Scope changes after kickoff are quoted separately before work begins.</li></ul></div>' +
        '<div class="section"><div class="mono">Acceptance</div><div class="sign"><div>' + esc(q.client || 'Client') + '<br>Name, title, date</div><div>Matchlight<br>' + esc(q.preparedBy || 'Name') + ', date</div></div></div>' +
        foot('4') +
      '</section>';

    document.getElementById('pages').innerHTML = cover + p2 + p3;
  }

  // From a link: #q=<base64url JSON>
  var m = /[#&]q=([^&]+)/.exec(location.hash);
  if (m) {
    try { render(JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))))); } catch (e) {}
  }
  // Live from the quote builder in the same browser.
  if ('BroadcastChannel' in window && !m) {
    var ch = new BroadcastChannel('ml-quote');
    ch.onmessage = function (e) { if (e.data && typeof e.data === 'object') render(e.data); };
    ch.postMessage('ready');
  }
  document.getElementById('print').addEventListener('click', function () { window.print(); });
  if (/[?&]print=1/.test(location.search)) setTimeout(function () { window.print(); }, 800);
})();
</script>
</body>
</html>
